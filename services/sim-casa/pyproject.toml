[project]
name = "sim-casa"
version = "0.1.0"
description = "Yarumo virtual house: simulated MQTT devices for Home Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "paho-mqtt>=2.1,<3",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
sim-casa = "sim_casa.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_casa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
