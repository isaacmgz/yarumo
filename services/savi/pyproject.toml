[project]
name = "savi"
version = "0.1.0"
description = "Savi-IA: learns the routines of the Yarumo house and proposes energy-saving automations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "tzdata>=2024.1",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6",
]

[project.scripts]
savi = "savi.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savi"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
