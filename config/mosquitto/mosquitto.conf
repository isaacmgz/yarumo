# Mosquitto 2 config for the Yarumo demo (docs/02-arquitectura.md, "Seguridad mínima").

listener 1883
allow_anonymous false
# Generated by scripts/mqtt-passwd.sh from MQTT_USER/MQTT_PASSWORD in .env (not committed).
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S
